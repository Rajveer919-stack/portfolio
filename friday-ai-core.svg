<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="FRIDAY AI animated core">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030712"/><stop offset="1" stop-color="#082f49"/></linearGradient>
  <radialGradient id="glow"><stop stop-color="#67e8f9" stop-opacity=".55"/><stop offset=".55" stop-color="#0891b2" stop-opacity=".16"/><stop offset="1" stop-color="#020617" stop-opacity="0"/></radialGradient>
  <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a5f3fc"/><stop offset=".5" stop-color="#06b6d4"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="8"/></filter>
</defs>
<rect width="1000" height="300" rx="22" fill="url(#bg)"/>
<circle cx="190" cy="150" r="135" fill="url(#glow)"/>
<g transform="translate(190 150)">
  <circle r="92" fill="none" stroke="#164e63" stroke-width="1" stroke-dasharray="3 8"/>
  <circle r="75" fill="none" stroke="url(#ring)" stroke-width="3" stroke-dasharray="150 24 35 24">
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
  </circle>
  <circle r="58" fill="none" stroke="#22d3ee" stroke-opacity=".75" stroke-width="1.5" stroke-dasharray="5 7">
    <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle r="42" fill="#083344" stroke="#67e8f9" stroke-width="2">
    <animate attributeName="r" values="40;44;40" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <circle r="28" fill="#22d3ee" opacity=".25" filter="url(#blur)"/>
  <path d="M-17 -15 L-17 15 M-17 -15 L-3 -15 Q12 -15 12 -2 Q12 10 -3 10 L-17 10 M2 15 L19 15" fill="none" stroke="#cffafe" stroke-width="4" stroke-linecap="round"/>
  <circle cx="0" cy="-104" r="4" fill="#67e8f9"><animate attributeName="opacity" values=".2;1;.2" dur="1.6s" repeatCount="indefinite"/></circle>
</g>
<g font-family="monospace">
  <text x="360" y="112" fill="#67e8f9" font-size="17" letter-spacing="5">PERSONAL AI ASSISTANT</text>
  <text x="356" y="168" fill="#ecfeff" font-size="54" font-weight="700" letter-spacing="3">FRIDAY AI</text>
  <text x="360" y="205" fill="#7dd3fc" font-size="17" letter-spacing="2">INTELLIGENCE • AUTOMATION • PRODUCTIVITY</text>
  <text x="360" y="248" fill="#22d3ee" font-size="13">[ PORTFOLIO VISUAL // PROJECT IN DEVELOPMENT ]</text>
  <circle cx="340" cy="242" r="4" fill="#22c55e"><animate attributeName="opacity" values="1;.25;1" dur="1.2s" repeatCount="indefinite"/></circle>
</g>
</svg>